<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
.header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 16px 24px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.header h1 { font-size: 20px; font-weight: 600; }
.header p { font-size: 12px; opacity: .85; margin-top: 4px; }
.chat-container { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; background: #fff; box-shadow: 0 0 20px rgba(0,0,0,.05); }
.messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; background: #667eea; color: #fff; border-bottom-right-radius: 4px; }
.message.agent { align-self: flex-start; background: #f1f3f4; color: #333; border-bottom-left-radius: 4px; }
.message.system { align-self: center; background: #fff3cd; color: #856404; font-size: 12px; padding: 6px 12px; border-radius: 16px; }
.message.error { align-self: center; background: #f8d7da; color: #721c24; font-size: 13px; padding: 10px 16px; border-radius: 12px; }
.input-area { padding: 16px 24px; border-top: 1px solid #e8eaed; display: flex; gap: 12px; background: #fff; }
.input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; transition: border-color .2s; }
.input-area input:focus { border-color: #667eea; }
.input-area button { padding: 12px 24px; background: #667eea; color: #fff; border: none; border-radius: 24px; font-size: 14px; cursor: pointer; transition: background .2s; display: flex; align-items: center; gap: 4px; }
.input-area button:hover { background: #5a6fd6; }
.input-area button:disabled { opacity: .6; cursor: not-allowed; }
.intent-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; display: inline-block; font-weight: 500; }
.intent-technical { background: #d1ecf1; color: #0c5460; }
.intent-aftersales { background: #fce4d6; color: #c65911; }
.intent-customer { background: #d4edda; color: #155724; }
.intent-escalate { background: #f8d7da; color: #721c24; }
.typing { display: flex; gap: 4px; padding: 8px 0; }
.typing span { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
</style>
</head>
<body>
<div class="header">
  <h1>智能客服</h1>
  <p>技术支持 · 售后服务 · 客户服务 三部门协作</p>
</div>
<div class="chat-container">
  <div class="messages" id="messages">
    <div class="message agent">
      👋 您好！我是智能客服助手，技术、售后、客服三部门随时为您服务。请问有什么可以帮您的？
    </div>
  </div>
  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入您的问题..." onkeypress="handleKeyPress(event)" autofocus>
    <button onclick="sendMessage()" id="sendBtn">发送</button>
  </div>
</div>

<script>
const INTENT_LABELS = {
  technical: '🔧 技术支持',
  aftersales: '🔙 售后服务',
  customer: '📦 客户服务',
  escalate: '🚨 转接人工',
};

function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

async function sendMessage() {
  const input = document.getElementById('userInput');
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, 'user');
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  const typingId = showTyping();

  try {
    // 30 秒超时
    const ctrl = new AbortController();
    const timer = setTimeout(function() { ctrl.abort(); }, 30000);

    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionStorage.getItem('sid') || undefined }),
      signal: ctrl.signal,
    });

    clearTimeout(timer);

    if (!resp.ok) {
      removeTyping(typingId);
      if (resp.status >= 500) {
        addError('服务器异常（' + resp.status + '），请稍后重试');
      } else {
        addError('请求失败（' + resp.status + '），请检查输入后重试');
      }
      document.getElementById('sendBtn').disabled = false;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let agentMsgId = null;
    let intentShown = false;
    let fullText = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data || data === '[DONE]') continue;
        try { handleSSE(JSON.parse(data)); } catch(e) { /* 忽略格式错误的 SSE 行 */ }
      }
    }

    removeTyping(typingId);
    if (!agentMsgId) {
      addError('未能获取回复，请稍后重试');
    }

    function handleSSE(json) {
      if (json.event === 'intent' && json.data) {
        const d = JSON.parse(json.data);
        if (d.intent && !intentShown) {
          intentShown = true;
          addSystemMsg('已转接: ' + (INTENT_LABELS[d.intent] || d.intent));
        }
      } else if (json.event === 'token' && json.data) {
        const d = JSON.parse(json.data);
        fullText += d.token;
        if (!agentMsgId) {
          removeTyping(typingId);
          agentMsgId = addMessage(d.token, 'agent');
        } else {
          updateMessage(agentMsgId, fullText);
        }
      } else if (json.event === 'done') {
        const d = JSON.parse(json.data);
        if (d.session_id) sessionStorage.setItem('sid', d.session_id);
        if (d.intent && !intentShown) {
          addSystemMsg('已转接: ' + (INTENT_LABELS[d.intent] || d.intent));
        }
      } else if (json.event === 'error') {
        removeTyping(typingId);
        const d = JSON.parse(json.data);
        addError('服务处理异常: ' + d.error);
      }
    }
  } catch(e) {
    removeTyping(typingId);
    if (e.name === 'AbortError') {
      addError('请求超时，服务器响应过慢，请稍后重试');
    } else {
      addError('网络连接失败，请检查网络后重试');
    }
  }
  document.getElementById('sendBtn').disabled = false;
}

function addError(text) {
  const div = document.createElement('div');
  div.className = 'message error';
  div.textContent = '⚠ ' + text;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = text;
  const id = 'msg-' + Date.now();
  div.id = id;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return id;
}

function updateMessage(id, text) {
  const el = document.getElementById(id);
  if (el) { el.textContent = text; scrollBottom(); }
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'message system';
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
}

function showTyping() {
  const id = 'typing-' + Date.now();
  const div = document.createElement('div');
  div.className = 'message agent';
  div.id = id;
  div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function scrollBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
